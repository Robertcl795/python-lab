<div class="movies-container">
  <h1>{{ title }}</h1>
  <div class="movies-grid">
    @for (movie of movies; track movie.title) {
      <mat-card class="movie-card">
        <mat-card-header>
          <mat-card-title>{{ movie.title }}</mat-card-title>
          <mat-card-subtitle>{{ movie.year }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="movie-info">
            <mat-chip-set>
              <mat-chip>{{ movie.genre }}</mat-chip>
              <mat-chip color="accent">⭐ {{ movie.rating }}</mat-chip>
            </mat-chip-set>
            <p class="movie-description">{{ movie.description }}</p>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary">DETAILS</button>
          <button mat-button>WATCH</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
<router-outlet></router-outlet>
